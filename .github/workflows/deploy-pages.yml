name: Deploy production Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "site/**"
      - "PROVENANCE.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          path: deployment
          persist-credentials: false
      - name: Check out exact private source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
          ref: ${{ vars.SOURCE_COMMIT }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies
        working-directory: source
        run: npm ci
      - name: Run production frontend suites
        working-directory: source
        run: npm run test:pages-deployment
      - name: Run Reference-First gates
        working-directory: source
        run: |
          npm run test:reference-first
          node scripts/arfr-prompt9/reference-first-bypass-census.mjs --check
      - name: Build and scan production Pages assets
        working-directory: source
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PUBLIC_BASE_PATH: ${{ vars.VITE_PUBLIC_BASE_PATH }}
          VITE_SOURCE_COMMIT: ${{ vars.SOURCE_COMMIT }}
        run: npm run build:pages
      - name: Prove committed deployment assets are reproducible
        run: diff -r --no-dereference source/dist deployment/site
      - name: Upload production artifact only
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
